name: Build and test

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    env:
      LEAN_NUM_THREADS: 2
    steps:
      - uses: actions/checkout@v5
      - name: Build Lean kernel
        uses: leanprover/lean-action@v1
        with:
          lake-package-directory: HotaruKernel
          build: "true"
          test: "false"
          lint: "false"
          leanchecker: "false"

      - name: Install bindgen prerequisites
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang libclang-dev
      - name: Configure libclang
        if: runner.os == 'macOS'
        run: echo "LIBCLANG_PATH=$(xcode-select -p)/Toolchains/XcodeDefault.xctoolchain/usr/lib" >> "$GITHUB_ENV"
      # The Rust FFI and hotaruLean shared library support Linux and macOS only.
      - name: Build Rust targets
        if: runner.os != 'Windows'
        run: cargo build --workspace --all-targets --locked

      - name: Test Lean kernel
        if: runner.os == 'Linux'
        working-directory: HotaruKernel
        run: lake test
      - name: Audit axioms
        if: runner.os == 'Linux'
        working-directory: HotaruKernel
        run: lake build HotaruKernelAudit
      - name: Check compiled declarations
        if: runner.os == 'Linux'
        working-directory: HotaruKernel
        run: lake env leanchecker HotaruKernelAudit
      - name: Check Rust formatting
        if: runner.os == 'Linux'
        run: cargo fmt --all --check
      - name: Check Rust adapter
        if: runner.os == 'Linux'
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Test Rust interface
        if: runner.os == 'Linux'
        run: cargo test --workspace --locked
      - name: Run Rust example
        if: runner.os == 'Linux'
        run: cargo run -p hotaru-sys --example refl --locked
