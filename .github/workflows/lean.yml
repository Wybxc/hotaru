name: Verify Kernel

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      LEAN_NUM_THREADS: 2
    steps:
      - uses: actions/checkout@v5
      - uses: leanprover/lean-action@v1
        with:
          lake-package-directory: HotaruKernel
          build: "true"
          test: "true"
          lint: "false"
          leanchecker: "false"
      - name: Audit axioms
        working-directory: HotaruKernel
        run: lake build HotaruKernelAudit
      - name: Check compiled declarations
        working-directory: HotaruKernel
        run: lake env leanchecker HotaruKernelAudit
      - name: Build C interface and integration tests
        working-directory: HotaruKernel
        run: lake build hotaruCTest
      - name: Test C interface
        working-directory: HotaruKernel
        run: .lake/build/bin/test_hotaru
