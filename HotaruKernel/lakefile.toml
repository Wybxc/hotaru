name = "HotaruKernel"
version = "0.1.0"
keywords = ["math"]
defaultTargets = ["HotaruKernel"]
testDriver = "HotaruKernelTests"

[leanOptions]
pp.unicode.fun = true # pretty-prints `fun a ↦ b`
relaxedAutoImplicit = false
weak.linter.mathlibStandardSet = true
maxSynthPendingDepth = 3

[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "v4.29.0"

[[require]]
name = "aesop"
scope = "leanprover-community"
rev = "v4.29.0"

[[lean_lib]]
name = "HotaruKernel"

[[lean_lib]]
name = "HotaruKernelTests"

[[lean_lib]]
name = "HotaruKernelAudit"
